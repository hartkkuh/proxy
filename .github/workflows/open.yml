name: Open URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to open"
        required: true
        type: string

jobs:
  open:
    runs-on: ubuntu-latest

    steps:
      - name: Send URL to proxy
        run: |
          curl -X GET "https://proxy-1-2d08.onrender.com/open?url=${{ github.event.inputs.url }}"