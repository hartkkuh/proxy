name: Open URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to open"
        required: true
        type: string

jobs:
  open:
    runs-on: ubuntu-latest

    steps:
      - name: Get screenshot
        run: |
          curl -X POST "https://proxy-1-2d08.onrender.com/open" \
          -H "Content-Type: application/json" \
          -d '{"url":"${{ github.event.inputs.url }}"}' \
          -o screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png